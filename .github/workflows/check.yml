# Shepherdr's check on GitHub's runners, on every pull request to main and every push to main (a merge). A task
# waits for its pull request's run before it merges. A branch with no pull request can still be checked by hand:
# gh workflow run check.yml --ref <branch>.
#
# One lean job (GitHub bills by the minute): the helpers' shared paths, the shared core's and the Herdr button's
# JavaScript parsed, the service and web app typechecked, tested and built, the shell scripts parsed, the repo's own
# rules (test_repo), the installer against throwaway roots (test_install: install, again, update, the switch from a
# 3.1 window install, uninstall, dry run) and herdr-task's commands.
# herdr-app check needs Herdr's window runtime, which a runner doesn't have: the one Herdr mod (herdr/open-shepherdr)
# is only parsed here.
name: Check

on:
  # no paths-ignore here: a docs-only pull request must report a check too, or it could never merge
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # upstream's 10 minutes no longer fit the fork's browser checks (tap, scroll, dictation, phone box, typing, still,
    # artifact, reading): about 5 minutes of them, and main alone past 600 s (fork #144)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the helpers carry layout.py's paths (the SHEP block)
        run: python3 bin/sync-shared --check
      - name: JavaScript parses (the shared core, the Herdr button)
        run: |
          fail=0
          for f in core/*.js $(find herdr -name 'main.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }
          done
          exit $fail
      - name: JSON parses
        run: for f in package.json tsconfig.json web/plugins.json lib/addons.json $(find herdr -name '*.json'); do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: service, shared core and web app (types, tests, build)
        run: |
          bun install --frozen-lockfile
          bun web/build-plugins.ts   # web/generated/ (not in git): the plugin list the app imports
          bunx tsc --noEmit -p .
          bun test service core web
          bun run build
      - name: every tappable thing is big enough for a finger (the built demo, phone and tablet widths)
        # SHEP-317: web/demo/tap-check.ts in the runner's own Chrome; it names what's under the minimum
        run: bun web/demo/tap-check.ts
      - name: chats and terminals open at the newest line (the built demo, phone and desktop)
        run: bun web/demo/scroll-check.ts
      - name: replies read well (the built demo, phone and desktop, each Chat text size)
        # fork #164: web/demo/reply-check.ts: code size and Copy, headings that step down, a wide table's named box
        run: bun web/demo/reply-check.ts
      - name: dictation and the call stay inside the message box, their wave moves, their buttons stay put
        # web/demo/dict-check.ts in the runner's own Chrome with a fake microphone (3.2.3's broken dictation)
        run: bun web/demo/dict-check.ts
      - name: a phone's message box is two rows, its bar one line (the built demo, 320 and 390 px)
        # fork #105: web/demo/box-check.ts in the runner's own Chrome
        run: bun web/demo/box-check.ts
      - name: typing on a phone (the built demo, 320 and 390 px, keyboard up and down)
        # fork #134: web/demo/phone-box-check.ts types a line, Return for a new line, sends with the button and with
        # Enter on a hardware keyboard, and measures the box's rows, in the runner's own Chrome
        run: bun web/demo/phone-box-check.ts
      - name: a draft is never lost (the built demo at phone width, with real reloads)
        # fork #149: web/demo/draft-check.ts reloads a draft with everything in it, a file still going up, a send cut
        # off mid-upload, files the browser couldn't keep and a full storage, in the runner's own Chrome
        run: bun web/demo/draft-check.ts --phone
      - name: a still page does no work while pictures wait (the built demo, phone and desktop)
        # fork/specs/ui-polish.md slice 2: web/demo/still-check.ts, no running animation and almost no style work over
        # 10 s with pictures blocked, hung and served, and no layout shift as they load, in the runner's own Chrome
        run: bun web/demo/still-check.ts
      - name: every demo artifact's words read in light, dark and night (the built demo, phone and desktop)
        # UI polish slice 19: web/demo/artifact-check.ts measures each line in the artifact's frame as painted, at 4.5:1, in Chrome's own dark too
        run: bun web/demo/artifact-check.ts
      - name: reading back on a phone (the built demo, 390 px; a desktop window unchanged)
        # fork #144: web/demo/reading-check.ts scrolls back through a chat and a task's thread: the tabs go, the box
        # folds, the view stays; a scroll down, a tap or focus brings them back; nothing with a draft
        run: bun web/demo/reading-check.ts
      - name: either reduced-motion switch alone stops every move (the built demo, phone and desktop)
        # fork/specs/ui-polish.md slice 5: web/demo/motion-check.ts opens a menu, a sheet and the spaces list, folds a
        # machine, drags a row and taps a suggested reply under each switch alone, in the runner's own Chrome
        run: bun web/demo/motion-check.ts
      - name: shell scripts parse
        # every script under plain bash (macOS's bash 3.2 is what people run; #908), and one whose first line says sh
        # also under sh (dash here). test_repo's test_each_parses checks every shipped script the same way.
        run: |
          for f in install.sh bin/herdr-browser bin/herdr-desktop hooks/*.sh $(ls service/restart.sh 2>/dev/null); do
            bash -n "$f" || { echo "::error file=$f::doesn't parse under bash"; exit 1; }
            case "$(head -1 "$f")" in *bash*) ;; *) sh -n "$f" || { echo "::error file=$f::doesn't parse under sh"; exit 1; } ;; esac
          done
      - name: tests (repo rules, installer, herdr-task)
        run: python3 -m unittest discover -s test -v
      - name: installer into a brand-new throwaway home (dry run, install, doctor, uninstall)
        run: |
          root=$(mktemp -d)
          ./install.sh --root "$root" --dry-run --yes
          ./install.sh --root "$root" --yes
          python3 bin/shepherdr doctor --root "$root"
          python3 bin/shepherdr uninstall --root "$root"
