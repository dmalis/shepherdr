name: Bug
description: Something in Shepherdr doesn't work as it should
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Public repo. Leave out names, paths, machine names, emails and anything private.
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Shepherdr version
