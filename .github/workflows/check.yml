# Shepherdr's check on GitHub's runners, on every pull request to main and every push to main (a merge). A task
# waits for its pull request's run before it merges. A branch with no pull request can still be checked by hand:
# gh workflow run check.yml --ref <branch>.
#
# The helpers' shared paths, the shared core's and the Herdr button's JavaScript parsed, the service and web app
# typechecked, tested and built, the shell scripts parsed, the repo's own rules (test_repo), the installer against
# throwaway roots (test_install: install, again, update, the switch from a 3.1 window install, uninstall, dry run),
# herdr-task's commands, and the browser checks against the built demo.
# herdr-app check needs Herdr's window runtime, which a runner doesn't have: the one Herdr mod (herdr/open-shepherdr)
# is only parsed here.
#
# The parts run side by side, so the run takes as long as its slowest part, not their sum (fork #175: one job
# took 8 to 9 minutes and passed its 10-minute limit under load, then more than 15 as the fork's browser checks grew).
# Each job's 15 minutes is only a backstop: none takes more than a few. `build` builds the web app once and hands
# web/dist to the jobs that need it; the last job, `check`, passes only when every part passed: it is the one check a
# pull request needs, so a new part is added to its needs, and a new browser check is one more entry of `browser`.
name: Check

on:
  # no paths-ignore here: a docs-only pull request must report a check too, or it could never merge
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  # a pull request's older run gives way to its newer push; on main a run finishes, so every stretch of merges gets a
  # verdict, and only the newest waiting push runs after it (GitHub drops the older waiting one)
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: web app built (and the installer into a brand-new throwaway home)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the web app's build
        run: |
          bun install --frozen-lockfile
          bun web/build-plugins.ts   # web/generated/ (not in git): the plugin list the app imports
          bun run build
      - name: the first screen's script stays under its budget, sent compressed (docs/design.md, Performance)
        # fork #163: web/first-screen.ts counts the page's module script and what it imports, not what comes later
        run: bun web/first-screen.ts
      - uses: actions/upload-artifact@v4
        # kept a week, so "Re-run failed jobs" days later still finds it; a re-run of this job replaces it
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - name: installer into a brand-new throwaway home (dry run, install, doctor, uninstall)
        run: |
          root=$(mktemp -d)
          ./install.sh --root "$root" --dry-run --yes
          ./install.sh --root "$root" --yes
          python3 bin/shepherdr doctor --root "$root"
          python3 bin/shepherdr uninstall --root "$root"

  web:
    name: service, shared core and web app (parses, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the helpers carry layout.py's paths (the SHEP block)
        run: python3 bin/sync-shared --check
      - name: JavaScript parses (the shared core, the Herdr button)
        run: |
          fail=0
          for f in core/*.js $(find herdr -name 'main.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }
          done
          exit $fail
      - name: JSON parses
        run: for f in package.json tsconfig.json web/plugins.json lib/addons.json $(find herdr -name '*.json'); do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: shell scripts parse
        # every script under plain bash (macOS's bash 3.2 is what people run; #908), and one whose first line says sh
        # also under sh (dash here). test_repo's test_each_parses checks every shipped script the same way.
        run: |
          for f in install.sh bin/herdr-browser bin/herdr-desktop hooks/*.sh $(ls service/restart.sh 2>/dev/null); do
            bash -n "$f" || { echo "::error file=$f::doesn't parse under bash"; exit 1; }
            case "$(head -1 "$f")" in *bash*) ;; *) sh -n "$f" || { echo "::error file=$f::doesn't parse under sh"; exit 1; } ;; esac
          done
      - name: service, shared core and web app (types, tests)
        # the test files run four at a time, one per core of the runner
        run: |
          bun install --frozen-lockfile
          bun web/build-plugins.ts   # web/generated/ (not in git): the plugin list the app imports
          bunx tsc --noEmit -p .
          bun test --parallel=4 service core web

  python:
    # test_herdr_task and test_install are the two long files: each has a job, and every other test file runs in the
    # third, so a new file is never left out
    name: tests (${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [herdr-task, installer, repo rules and the rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the web app's packages, and its build from the build job (the installer tests install it)
        run: |
          bun install --frozen-lockfile
          bun web/build-plugins.ts
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: tests (${{ matrix.part }})
        working-directory: test
        run: |
          case "${{ matrix.part }}" in
            herdr-task) set -- test_herdr_task ;;
            installer) set -- test_install ;;
            *) set -- $(ls test_*.py | sed 's/\.py$//' | grep -vx -e test_herdr_task -e test_install) ;;
          esac
          python3 -m unittest -v "$@"

  browser:
    # each in the runner's own Chrome, against the build job's web/dist
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every tappable thing is big enough for a finger (the built demo, phone and tablet widths)
            # SHEP-317: web/demo/tap-check.ts names what's under the minimum
            run: bun web/demo/tap-check.ts
          - name: chats and terminals open at the newest line (the built demo, phone and desktop)
            run: bun web/demo/scroll-check.ts
          - name: replies read well (the built demo, phone and desktop, each Chat text size)
            # fork #164: web/demo/reply-check.ts: code size and Copy, headings that step down, a wide table's named box
            run: bun web/demo/reply-check.ts
          - name: dictation and the call stay inside the message box, their wave moves, their buttons stay put
            # web/demo/dict-check.ts with a fake microphone (3.2.3's broken dictation)
            run: bun web/demo/dict-check.ts
          - name: a phone's message box is two rows, its bar one line (the built demo, 320 and 390 px)
            # fork #105: web/demo/box-check.ts
            run: bun web/demo/box-check.ts
          - name: typing on a phone (the built demo, 320 and 390 px, keyboard up and down)
            # fork #134: web/demo/phone-box-check.ts types a line, Return for a new line, sends with the button and
            # with Enter on a hardware keyboard, and measures the box's rows
            run: bun web/demo/phone-box-check.ts
          - name: a draft is never lost (the built demo at phone width, with real reloads)
            # fork #149: web/demo/draft-check.ts reloads a draft with everything in it, a file still going up, a send
            # cut off mid-upload, files the browser couldn't keep and a full storage
            run: bun web/demo/draft-check.ts --phone
          - name: edits keep what you wrote (the built demo, desktop and phone)
            # fork #186: web/demo/edit-check.ts holds a suggestion with words in the box, pastes in the middle, types
            # on a phone with the keyboard up and drags a file over the page
            run: bun web/demo/edit-check.ts
          - name: a still page does no work while pictures wait (the built demo, phone and desktop)
            # fork/specs/ui-polish.md slice 2: web/demo/still-check.ts, no running animation and almost no style work
            # over 10 s with pictures blocked, hung and served, and no layout shift as they load
            run: bun web/demo/still-check.ts
          - name: every demo artifact's words read in light, dark and night (the built demo, phone and desktop)
            # UI polish slice 19: web/demo/artifact-check.ts measures each line in the artifact's frame as painted, at
            # 4.5:1, in Chrome's own dark too
            run: bun web/demo/artifact-check.ts
          - name: reading back on a phone (the built demo, 390 px; a desktop window unchanged)
            # fork #144: web/demo/reading-check.ts scrolls back through a chat and a task's thread: the tabs go, the
            # box folds, the view stays; a scroll down, a tap or focus brings them back; nothing with a draft
            run: bun web/demo/reading-check.ts
          - name: either reduced-motion switch alone stops every move (the built demo, phone and desktop)
            # fork/specs/ui-polish.md slice 5: web/demo/motion-check.ts opens a menu, a sheet and the spaces list,
            # folds a machine, drags a row and taps a suggested reply under each switch alone
            run: bun web/demo/motion-check.ts
          - name: a task row's swipe to the left, with real touch (the built demo, 390 px)
            # fork #185: web/demo/swipe-check.ts opens, closes and full-slides rows with CDP touch events: one open at
            # a time, scrolling and the edge strip untouched, Archive's wait, Undo and failure, Reduced and Zoom
            run: bun web/demo/swipe-check.ts
          - name: everything in a chat fits its column on a phone (the built demo, 320 and 390 px)
            # fork #85: web/demo/fit-check.ts measures every card, row and bubble in the demo's chats, at Chat text
            # Default and Larger: nothing inside a card or a news row reaches past it, nothing reaches past the column
            # or the screen
            run: bun web/demo/fit-check.ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: the web app's packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  check:
    name: check
    # the one check a pull request needs: every part above passed. It still runs when a part failed (a skipped
    # required check would count as passed); when the run is cancelled (a newer push), GitHub cancels it too
    needs: [build, web, python, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
        run: |
          echo "build, web, tests, browser checks: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a part of the check didn't pass ($r): see its job above"; exit 1; }
          done
          # a matrix's result is one word for all of its jobs: each job of this run passed on its own too
          for i in 1 2 3; do
            bad=$(gh api --paginate "$JOBS" --jq '.jobs[] | select(.name != "check" and .conclusion != "success") | "\(.name): \(.conclusion // .status)"') && break
            [ "$i" = 3 ] && { echo "::error::GitHub didn't list this run's jobs"; exit 1; }
            sleep 10
          done
          [ -z "$bad" ] || { echo "::error::a part of the check didn't pass"; echo "$bad"; exit 1; }
